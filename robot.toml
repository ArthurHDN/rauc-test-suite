#:schema https://raw.githubusercontent.com/d-biehl/robotcode/refs/heads/main/etc/robot.toml.json
#
# Robot Framework / RobotCode configuration for the RAUC integration tests.
# Normally used through run_tests.py (timestamped, auditable result directories);
# it can also be used directly:  robotcode --profile safe robot
name = "RAUC Integration Tests"
paths = ["suites"]
python-path = ["libraries"]
output-dir = "results/adhoc"
log-level = "DEBUG"
default-profiles = ["safe"]

[listeners]
AuditListener = []

[variables]
# Everything below can be overridden with  run_tests.py -v NAME:VALUE
# The device is selected with  run_tests.py --device NAME  (or DEVICE in .env), not here.
BOOT_TIMEOUT = "900"
INSTALL_TIMEOUT = "1800"
SOAK_CYCLES = "6"
POWER_LOSS_PERCENT = "40"
BOOT_FAILURE_ATTEMPTS = "5"

# --------------------------------------------------------------------------- profiles
# Tags: readonly < slot-change < rejected-install < install < reboot < power-loss < boot-failure
#       plus soak (long).

# No reboot and no installation. Slot-change tests only toggle the bootloader's primary slot
# temporarily and restore it; rejected-install tests must not modify any slot.
[profiles.safe]
excludes = ["install", "reboot", "power-loss", "boot-failure", "soak"]

# Adds installation and reboot tests (sections 5, 6.4, 6.7, 6.8, 7.3, 7.6, 7.7).
[profiles.update]
excludes = ["power-loss", "boot-failure", "soak"]

# Everything required by the acceptance criteria of RAUC-TEST-PLAN.md
# (sections 1-5, TC-6.1 - TC-6.6). Needs TARGET_POWER_CYCLE_CMD for hung boots.
[profiles.acceptance]
excludes = ["soak"]

# Acceptance plus the soak test (TC-7.1).
[profiles.full]
excludes = []
